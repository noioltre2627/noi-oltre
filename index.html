<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOI OLTRE - Cogestione Polo Tecnologico</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    .bg-glow-1, .bg-glow-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
      animation: floatGlow 8s infinite alternate ease-in-out;
    }
    .bg-glow-1 { top: 15%; left: -50px; background: rgba(16, 185, 129, 0.25); }
    .bg-glow-2 { bottom: 10%; right: -50px; background: rgba(239, 68, 68, 0.25); animation-delay: -4s; }

    @keyframes floatGlow {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    header {
      padding: 1.2rem 1.5rem;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-btn:active { transform: scale(0.95); }
    .nav-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .nav-btn.active { color: #fff; background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }

    .admin-controls { display: flex; gap: 0.5rem; align-items: center; }

    .admin-toggle-btn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .admin-toggle-btn:active { transform: scale(0.95); }
    .admin-toggle-btn.logged-in { background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); color: var(--accent-green); }

    .save-cloud-btn {
      background: var(--accent-green);
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      animation: pulseBtn 2s infinite;
    }
    .save-cloud-btn:active { transform: scale(0.95); }
    .save-cloud-btn.admin-visible { display: flex; }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
    .page { display: none; opacity: 0; transform: translateY(12px); transition: opacity 0.3s ease, transform 0.3s ease; }
    .page.active { display: block; opacity: 1; transform: translateY(0); }

    .hero {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      margin-bottom: 2rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .hero-logo-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
      animation: logoPulse 4s infinite ease-in-out;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 45px rgba(16, 185, 129, 0.7); }
    }

    .hero-quote {
      font-size: 1.15rem;
      line-height: 1.6;
      max-width: 750px;
      margin: 0 auto 1.8rem auto;
      color: #e2e8f0;
      font-style: italic;
      font-weight: 300;
    }

    /* NUOVO COUNTDOWN DESIGN */
    .countdown-wrapper {
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      padding: 1.2rem;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.05);
    }
    .countdown-title {
      font-size: 0.8rem;
      color: var(--accent-green);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.8rem;
    }
    .countdown-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
    }
    .countdown-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }
    .countdown-number {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .countdown-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.3rem;
      font-weight: 600;
    }
    .countdown-divider {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-green);
      margin-top: -0.8rem;
    }

    .social-section-title {
      text-align: center;
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      font-weight: 700;
    }

    .social-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .social-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .social-card:active { transform: scale(0.97); }

    .social-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: transform 0.3s ease;
    }

    .social-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }
    .social-card:hover .social-icon-wrapper { transform: scale(1.1) rotate(-5deg); }

    .social-card.instagram:hover { border-color: #e1306c; }
    .social-card.instagram .social-icon-wrapper { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }

    .social-card.tiktok:hover { border-color: #00f2fe; }
    .social-card.tiktok .social-icon-wrapper { background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.2); }

    .social-card.school:hover { border-color: #3b82f6; }
    .social-card.school .social-icon-wrapper { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; }

    .social-info h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.1rem; }
    .social-info p { font-size: 0.8rem; color: var(--text-muted); }
    .social-arrow { margin-left: auto; color: var(--text-muted); font-size: 1rem; transition: transform 0.3s ease; }
    .social-card:hover .social-arrow { transform: translateX(4px); color: #fff; }

    .day-selector { display: flex; justify-content: center; gap: 0.6rem; margin-bottom: 1.8rem; flex-wrap: wrap; align-items: center; }
    .day-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted);
      padding: 0.7rem 1.2rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.25s ease;
    }
    .day-btn:active { transform: scale(0.95); }
    .day-btn.active, .day-btn:hover { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; }
    .slot-card { 
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.2rem; 
      display: flex; flex-direction: column; gap: 1rem; transition: transform 0.3s ease, border-color 0.3s ease;
      animation: fadeInUp 0.4s ease both;
    }
    .slot-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
    .slot-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 0.7rem; }
    .slot-time { font-weight: 700; color: var(--accent-gold); font-size: 1rem; }
    
    .course-item-box { 
      background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.8rem; 
      display: flex; flex-direction: column; gap: 0.5rem; transition: all 0.3s ease; position: relative;
      animation: fadeInUp 0.4s ease both;
    }
    .course-item-box.secret-item { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.05); }
    .course-item-box:hover { border-color: var(--accent-green); transform: translateX(2px); }
    .secret-badge { position: absolute; top: 8px; right: 8px; background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; font-weight: 700; border: 1px solid var(--accent-gold); }

    .course-display-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .course-display-info { font-size: 0.85rem; color: var(--accent-gold); display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .course-display-desc { font-size: 0.85rem; color: var(--text-muted); }

    .section-title { font-size: 1.6rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem; }
    .table-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow-x: auto; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.9rem 1rem; border-bottom: 1px solid var(--card-border); transition: background 0.2s ease; }
    th { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    
    tbody tr { animation: fadeInUp 0.3s ease both; transition: background 0.3s ease; }
    tbody tr.rank-updated { animation: rankFlash 1.2s ease; }
    @keyframes rankFlash {
      0% { background: rgba(245, 158, 11, 0.4); }
      100% { background: transparent; }
    }
    
    tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
    tr:last-child td { border-bottom: none; }
    .team-name { font-weight: 700; color: #a5f3fc; }

    .matches-list { display: grid; gap: 0.8rem; }
    .match-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      transition: all 0.3s ease;
      animation: fadeInUp 0.4s ease both;
    }
    .match-card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
    .match-info-side { display: flex; flex-direction: column; gap: 0.1rem; font-size: 0.8rem; color: var(--accent-gold); font-weight: 600; }
    .match-teams { display: flex; align-items: center; gap: 0.8rem; font-size: 1.05rem; font-weight: 700; flex-grow: 1; justify-content: center; }
    .match-score-inputs { display: flex; align-items: center; gap: 0.4rem; }
    .score-input {
      width: 42px; height: 38px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
      border-radius: 8px; color: #fff; text-align: center; font-size: 1.05rem; font-weight: 700;
      transition: border-color 0.3s ease;
    }
    .score-input:focus { outline: none; border-color: var(--accent-green); }
    .btn-action { 
      background: var(--accent-green); color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; 
      transition: opacity 0.2s ease, transform 0.2s ease; 
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-action:hover { opacity: 0.9; }
    .btn-delete { background: var(--accent-red); }

    .bracket-container {
      display: flex;
      justify-content: space-between;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 1rem 0 2rem 0;
    }
    .bracket-round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      min-width: 220px;
      gap: 1.5rem;
    }
    .bracket-round-title {
      text-align: center;
      font-size: 0.9rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    .bracket-match {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding:
